[project]
name = "collector"
version = "0.1.0"
description = "Pings each branch router and posts the raw results to the API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "icmplib>=3.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
